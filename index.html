<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinical Psychometric Screening Dashboard</title>
    <!-- Core External Dependencies via Secure CDN Links -->
    <script src="https://tailwindcss.com"></script>
    <script src="https://jsdelivr.net"></script>
    <!-- Link to your external decoupled calculation engine -->
    <script src="scoring.js"></script>
    <style>
        .choice-card:hover { border-color: #3b82f6; background-color: #f0fdf4; }
        .active-radio { border-color: #10b981 !important; background-color: #ecfdf5 !important; box-shadow: 0 0 0 2px #10b981; }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- Primary Layout Header Space -->
    <header class="bg-white border-b border-slate-200 py-4 px-6 sticky top-0 z-50 shadow-sm">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-tight text-slate-900 flex items-center gap-2">
                <span>Clinical Screening Workspace</span>
                <span id="testProgressBadge" class="hidden text-xs bg-indigo-100 text-indigo-800 font-semibold px-2.5 py-0.5 rounded"></span>
            </h1>
            <div id="clientDisplayID" class="text-sm font-medium text-slate-500 bg-slate-100 px-3 py-1 rounded-md hidden"></div>
        </div>
    </header>

    <!-- Main Dynamic Application Container -->
    <main class="flex-grow max-w-4xl w-full mx-auto p-4 md:p-8 flex flex-col justify-center">

        <!-- VIEW STATE 1: GATEWAY SECURITY PORTAL -->
        <section id="viewPortal" class="bg-white border border-slate-200 rounded-2xl shadow-xl p-6 md:p-10 max-w-md w-full mx-auto animate-fade-in">
            <div class="text-center mb-8">
                <div class="w-12 h-12 bg-indigo-100 rounded-full flex items-center justify-center mx-auto mb-3 text-indigo-600">
                    <svg xmlns="http://w3.org" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>
                </div>
                <h2 class="text-2xl font-bold text-slate-900">Secure Client Entry</h2>
                <p class="text-sm text-slate-500 mt-1">Input authorized diagnostic tracking credentials</p>
            </div>
            
            <form id="portalForm" class="space-y-5" onsubmit="handlePortalAccess(event)">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">Anonymous Client Identifier</label>
                    <input type="text" id="clientIdInput" required placeholder="e.g., Client_884A" class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all bg-slate-50">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">Administrative Security PIN</label>
                    <input type="password" id="accessPinInput" required placeholder="••••" class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all bg-slate-50 tracking-widest text-center text-lg">
                </div>
                <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-xl transition-all transform active:scale-[0.98] shadow-md shadow-indigo-200 mt-2">Initialize Battery</button>
            </form>
            <div id="portalError" class="hidden mt-4 text-sm bg-rose-50 border border-rose-200 text-rose-700 px-4 py-3 rounded-xl text-center"></div>
        </section>

        <!-- VIEW STATE 2: CLINICAL TESTING RUNGRID -->
        <section id="viewTesting" class="bg-white border border-slate-200 rounded-2xl shadow-md p-6 md:p-10 w-full hidden animate-fade-in flex-col">
            <!-- Progress Matrix Indicator -->
            <div class="mb-6 w-full bg-slate-100 rounded-full h-2 overflow-hidden">
                <div id="topProgressBar" class="bg-indigo-600 h-2 w-0 transition-all duration-300"></div>
            </div>
            
            <!-- Question Content Node Container -->
            <div class="flex-grow flex flex-col justify-center min-h-[300px]">
                <div id="testMetaDataBlock" class="mb-4 text-sm font-semibold tracking-wide text-indigo-600 uppercase"></div>
                <h3 id="questionTextDisplay" class="text-xl md:text-2xl font-bold text-slate-900 leading-snug mb-8"></h3>
                <div id="optionsGridContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            </div>

            <!-- Execution Action Bar Footer -->
            <div class="border-t border-slate-100 pt-6 mt-8 flex justify-between items-center">
                <button id="btnPrevQuestion" onclick="navigateQuestion(-1)" class="px-5 py-2.5 border border-slate-200 text-slate-600 rounded-xl font-medium hover:bg-slate-50 disabled:opacity-30 disabled:pointer-events-none transition-all">Previous Item</button>
                <div id="counterIndicator" class="text-sm font-semibold text-slate-400 tracking-wider uppercase"></div>
                <button id="btnNextQuestion" onclick="navigateQuestion(1)" disabled class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-medium disabled:opacity-40 disabled:cursor-not-allowed shadow-md shadow-indigo-100 transition-all">Next Item</button>
            </div>
        </section>

        <!-- VIEW STATE 3: INTERACTIVE EVALUATION DASHBOARD -->
        <section id="viewDashboard" class="w-full hidden space-y-8 animate-fade-in">
            <!-- Summary Metric Header Cards -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div class="bg-white p-5 border border-slate-200 rounded-2xl shadow-sm text-center"><p class="text-xs font-semibold text-slate-400 uppercase tracking-wide">AQ Total</p><p id="cardScoreAQ" class="text-3xl font-black text-slate-900 mt-1">-</p></div>
                <div class="bg-white p-5 border border-slate-200 rounded-2xl shadow-sm text-center"><p class="text-xs font-semibold text-slate-400 uppercase tracking-wide">RAADS-R</p><p id="cardScoreRAADS" class="text-3xl font-black text-slate-900 mt-1">-</p></div>
                <div class="bg-white p-5 border border-slate-200 rounded-2xl shadow-sm text-center"><p class="text-xs font-semibold text-slate-400 uppercase tracking-wide">CAT-Q Total</p><p id="cardScoreCATQ" class="text-3xl font-black text-slate-900 mt-1">-</p></div>
                <div class="bg-white p-5 border border-slate-200 rounded-2xl shadow-sm text-center"><p class="text-xs font-semibold text-slate-400 uppercase tracking-wide">CATI Total</p><p id="cardScoreCATI" class="text-3xl font-black text-slate-900 mt-1">-</p></div>
            </div>

            <!-- Visualization Canvas Row Split -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <!-- Chart Layout Block container -->
                <div class="lg:col-span-2 bg-white border border-slate-200 rounded-2xl p-6 shadow-sm flex flex-col justify-center">
                    <h4 class="text-base font-bold text-slate-900 mb-4 flex items-center gap-2">
                        <svg xmlns="http://w3.org" class="h-5 w-5 text-teal-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" /></svg>
                        Normalized Subscale Dimensional Tracker (%)
                    </h4>
                    <div class="relative w-full aspect-[4/3] sm:aspect-[16/10] md:aspect-[16/9]">
                        <canvas id="subscaleChartCanvas"></canvas>
                    </div>
                </div>

                <!-- Evaluated Convergent Trait Themes Block layout -->
                <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm flex flex-col">
                    <h4 class="text-base font-bold text-slate-900 mb-4 flex items-center gap-2">
                        <svg xmlns="http://w3.org" class="h-5 w-5 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01" /></svg>
                        Identified Trait Clusters
                    </h4>
                    <div id="thematicResultsContainer" class="space-y-4 flex-grow overflow-y-auto max-h-[360px] pr-1"></div>
                </div>
            </div>

            <!-- MANDATORY PROTECTIVE PROFESSIONAL DISMISSAL DISCLAIMER BOX CARD -->
            <div class="bg-gradient-to-r from-blue-50 to-indigo-50 border border-blue-200 rounded-2xl p-6 md:p-8 shadow-sm flex flex-col md:flex-row items-center gap-6 text-center md:text-left">
                <div class="w-14 h-14 bg-blue-600 text-white rounded-2xl flex items-center justify-center shrink-0 shadow-lg shadow-blue-100">
