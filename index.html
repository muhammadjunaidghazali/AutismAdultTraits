<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clinical Psychometric Workspace</title>
  
  <!-- Tailwind CSS for Modern UI -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React 18 & Babel for SPA compilation in browser -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Chart.js for Summary Visuals -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .fade-in { animation: fadeIn 0.3s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 h-screen overflow-hidden">
  
  <div id="root" class="h-full"></div>

  <!-- Load Scoring Engine -->
  <script src="scoring.js"></script>

  <!-- React SPA Application -->
  <script type="text/babel">
    const { useState, useEffect, useCallback, useMemo, useRef } = React;

    // 🔒 CONFIGURATION
    const CONFIG = {
      GAS_URL: "https://script.google.com/macros/s/AKfycbwDORC7NB5MGwneZb9-PFm3ivOTep5Be8OM9YbRcquPq8KHfDNqcPUKmdMUJtFcSRws_Q/exec",
      API_KEY: "NEURO_SCREEN_SECRET_2026" // Must match Code.gs
    };

    // ==========================================
    // MAIN APP COMPONENT
    // ==========================================
    function App() {
      const [view, setView] = useState('overview');
      const [testData, setTestData] = useState(null);
      const [flatQuestions, setFlatQuestions] = useState([]);
      const [clientInfo, setClientInfo] = useState(null);
      const [answers, setAnswers] = useState({});
      const [results, setResults] = useState(null);
      const [adminRecords, setAdminRecords] = useState([]);
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [loading, setLoading] = useState(false);
      const [toast, setToast] = useState(null);

      useEffect(() => {
        // Load tests.json on mount
        fetch('tests.json')
          .then(res => res.json())
          .then(raw => {
            const cleaned = cleanTestData(raw);
            setTestData(cleaned);
            setFlatQuestions(flattenQuestions(cleaned));
          })
          .catch(err => showToast("Failed to load tests.json", "error"));
      }, []);

      const showToast = (msg, type = "info") => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 4000);
      };

      const submitToBackend = async (payload) => {
        try {
          const response = await fetch(CONFIG.GAS_URL, {
            method: 'POST',
            // text/plain is REQUIRED for Google Apps Script CORS
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ ...payload, apiKey: CONFIG.API_KEY }),
            redirect: 'follow'
          });
          const text = await response.text();
          const json = JSON.parse(text);
          if (json.status === "error") throw new Error(json.message);
          return json;
        } catch (err) {
          showToast("Submission failed: " + err.message, "error");
          throw err;
        }
      };

      return (
        <div className="flex h-full">
          <Sidebar view={view} setView={setView} isAuthenticated={isAuthenticated} />
          
          <main className="flex-1 overflow-y-auto p-8 bg-slate-50">
            <div className="max-w-6xl mx-auto fade-in">
              {view === 'overview' && <Overview setView={setView} flatQuestions={flatQuestions} />}
              {view === 'intake' && <IntakeForm setView={setView} setClientInfo={setClientInfo} setAnswers={setAnswers} />}
              {view === 'assessment' && clientInfo && (
                <AssessmentWizard 
                  questions={flatQuestions} 
                  clientInfo={clientInfo}
                  answers={answers}
                  setAnswers={setAnswers}
                  setResults={setResults}
                  setView={setView}
                  submitToBackend={submitToBackend}
                  showToast={showToast}
                />
              )}
              {view === 'summary' && results && <SummaryReport results={results} clientInfo={clientInfo} />}
              {view === 'clinician' && (
                <ClinicianPortal 
                  isAuthenticated={isAuthenticated} 
                  setIsAuthenticated={setIsAuthenticated}
                  adminRecords={adminRecords}
                  setAdminRecords={setAdminRecords}
                  submitToBackend={submitToBackend}
                  showToast={showToast}
                />
              )}
            </div>
          </main>

          {toast && (
            <div className={`fixed bottom-6 right-6 px-6 py-3 rounded-lg shadow-lg text-white font-medium z-50
              ${toast.type === 'error' ? 'bg-red-600' : toast.type === 'success' ? 'bg-emerald-600' : 'bg-indigo-600'}`}>
              {toast.msg}
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // UI COMPONENTS
    // ==========================================
    function Sidebar({ view, setView, isAuthenticated }) {
      const links = [
        { id: 'overview', label: 'Overview', icon: '🏠' },
        { id: 'intake', label: 'Candidate Intake', icon: '📝' },
        { id: 'clinician', label: 'Clinician Portal', icon: '🔒' },
      ];

      return (
        <aside className="w-64 bg-slate-900 text-slate-300 flex flex-col p-6 shadow-xl">
          <div className="mb-10">
            <h1 className="text-xl font-bold text-white flex items-center gap-2">
              <span className="bg-indigo-500 p-2 rounded-lg text-sm">CP</span>
              Psychometric
            </h1>
            <p className="text-xs text-slate-500 mt-1">Clinical Workspace</p>
          </div>
          
          <nav className="flex-1 space-y-2">
            {links.map(link => (
              <button
                key={link.id}
                onClick={() => setView(link.id)}
                className={`w-full text-left px-4 py-3 rounded-lg font-medium transition flex items-center gap-3
                  ${view === link.id ? 'bg-indigo-600 text-white shadow-md' : 'hover:bg-slate-800'}`}
              >
                <span>{link.icon}</span> {link.label}
              </button>
            ))}
          </nav>

          <div className="text-xs text-slate-500 border-t border-slate-800 pt-4">
            <p>Preliminary screening only.</p>
            <p>Not a diagnostic instrument.</p>
          </div>
        </aside>
      );
    }

    function Overview({ setView, flatQuestions }) {
      return (
        <div className="space-y-8">
          <header>
            <h2 className="text-3xl font-bold text-slate-900">Neurodiversity Screening Workspace</h2>
            <p className="text-slate-500 mt-2">Comprehensive Trait & Camouflaging Assessment Battery</p>
          </header>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
              <h3 className="font-semibold text-slate-900 mb-2">Candidate Assessment</h3>
              <p className="text-sm text-slate-500 mb-4">Begin the 197-item psychometric evaluation battery.</p>
              <button onClick={() => setView('intake')} className="w-full bg-indigo-600 text-white py-2 rounded-lg font-medium hover:bg-indigo-700 transition">
                Start Intake
              </button>
            </div>
            <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
              <h3 className="font-semibold text-slate-900 mb-2">Battery Status</h3>
              <p className="text-sm text-slate-500 mb-4">AQ, RAADS-R, CAT-Q, and CATI loaded.</p>
              <div className="text-2xl font-bold text-emerald-600">{flatQuestions.length} Items Ready</div>
            </div>
            <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
              <h3 className="font-semibold text-slate-900 mb-2">Data Security</h3>
              <p className="text-sm text-slate-500 mb-4">End-to-end API key validation & PIN-protected records.</p>
              <div className="text-2xl font-bold text-indigo-600">Active</div>
            </div>
          </div>
        </div>
      );
    }

    function IntakeForm({ setView, setClientInfo, setAnswers }) {
      const [form, setForm] = useState({ name: '', email: '', phone: '', dob: '' });
      const [consent, setConsent] = useState(false);

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!consent) return alert("Please provide consent.");
        setClientInfo(form);
        setAnswers({}); // Reset answers
        setView('assessment');
      };

      return (
        <div className="max-w-2xl mx-auto bg-white p-8 rounded-xl shadow-sm border border-slate-200">
          <h2 className="text-2xl font-bold mb-6">Candidate Intake</h2>
          <form onSubmit={handleSubmit} className="space-y-4">
            <div className="grid grid-cols-2 gap-4">
              <div>
                <label className="block text-sm font-medium text-slate-700 mb-1">Full Name</label>
                <input required type="text" className="w-full border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-indigo-500 outline-none" onChange={e => setForm({...form, name: e.target.value})} />
              </div>
              <div>
                <label className="block text-sm font-medium text-slate-700 mb-1">Email</label>
                <input required type="email" className="w-full border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-indigo-500 outline-none" onChange={e => setForm({...form, email: e.target.value})} />
              </div>
              <div>
                <label className="block text-sm font-medium text-slate-700 mb-1">Phone</label>
                <input type="text" className="w-full border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-indigo-500 outline-none" onChange={e => setForm({...form, phone: e.target.value})} />
              </div>
              <div>
                <label className="block text-sm font-medium text-slate-700 mb-1">Date of Birth</label>
                <input required type="date" className="w-full border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-indigo-500 outline-none" onChange={e => setForm({...form, dob: e.target.value})} />
              </div>
            </div>
            
            <div className="flex items-start gap-3 bg-slate-50 p-4 rounded-lg border border-slate-200">
              <input type="checkbox" checked={consent} onChange={e => setConsent(e.target.checked)} className="mt-1" />
              <p className="text-sm text-slate-600">I understand this is a preliminary screening tool and not a formal medical diagnosis. I consent to my data being securely transmitted to the clinician database.</p>
            </div>

            <button type="submit" className="w-full bg-indigo-600 text-white py-3 rounded-lg font-bold hover:bg-indigo-700 transition">
              Begin Assessment Battery
            </button>
          </form>
        </div>
      );
    }

    function AssessmentWizard({ questions, clientInfo, answers, setAnswers, setResults, setView, submitToBackend, showToast }) {
      const [currentIndex, setCurrentIndex] = useState(0);
      const [submitting, setSubmitting] = useState(false);
      const currentQ = questions[currentIndex];
      const progress = ((currentIndex + 1) / questions.length) * 100;

      const handleSelect = (optionKey) => {
        const newAnswers = { ...answers, [`${currentQ.testId}_${currentQ.id}`]: optionKey };
        setAnswers(newAnswers);
        
        // Auto-advance
        if (currentIndex < questions.length - 1) {
          setTimeout(() => setCurrentIndex(currentIndex + 1), 200);
        }
      };

      const handleSubmit = async () => {
        setSubmitting(true);
        try {
          const engine = new AutismAssessmentEngine();
          const res = engine.calculateScores(answers, { AQ: {questions: questions.filter(q=>q.testId==='AQ')}, RAADS: {questions: questions.filter(q=>q.testId==='RAADS')}, CATQ: {questions: questions.filter(q=>q.testId==='CATQ')}, CATI: {questions: questions.filter(q=>q.testId==='CATI')} });
          
          await submitToBackend({
            action: "submitAssessment",
            client: clientInfo,
            totals: { AQ: res.rawResults.AQ.total, RAADS: res.rawResults.RAADS.total, CATQ: res.rawResults.CATQ.total, CATI: res.rawResults.CATI.total },
            metrics: res.normalizedMetrics,
            themes: res.thematicAnalysis,
            answers: answers
          });
          
          setResults(res);
          setView('summary');
          showToast("Assessment submitted successfully!", "success");
        } catch (err) {
          console.error(err);
        } finally {
          setSubmitting(false);
        }
      };

      if (!currentQ) return null;

      return (
        <div className="max-w-3xl mx-auto">
          <div className="mb-6">
            <div className="flex justify-between text-sm font-medium text-slate-500 mb-2">
              <span>{currentQ.testId} • Item {currentQ.id}</span>
              <span>{currentIndex + 1} / {questions.length}</span>
            </div>
            <div className="w-full bg-slate-200 rounded-full h-2.5">
              <div className="bg-indigo-600 h-2.5 rounded-full transition-all duration-300" style={{ width: `${progress}%` }}></div>
            </div>
          </div>

          <div className="bg-white p-8 rounded-xl shadow-sm border border-slate-200 min-h-[400px] flex flex-col">
            <h2 className="text-2xl font-semibold text-slate-900 mb-8 flex-1">{currentQ.text}</h2>
            
            <div className="grid grid-cols-1 gap-3">
              {currentQ.options.map(opt => (
                <button
                  key={opt}
                  onClick={() => handleSelect(opt)}
                  className={`text-left p-4 rounded-lg border-2 transition font-medium
                    ${answers[`${currentQ.testId}_${currentQ.id}`] === opt 
                      ? 'border-indigo-600 bg-indigo-50 text-indigo-900' 
                      : 'border-slate-200 hover:border-indigo-300 hover:bg-slate-50'}`}
                >
                  {formatLabel(opt)}
                </button>
              ))}
            </div>

            <div className="flex justify-between mt-8 pt-6 border-t border-slate-100">
              <button 
                onClick={() => setCurrentIndex(Math.max(0, currentIndex - 1))}
                disabled={currentIndex === 0}
                className="px-6 py-2 text-slate-600 font-medium disabled:opacity-50"
              >
                ← Previous
              </button>
              
              {currentIndex === questions.length - 1 ? (
                <button 
                  onClick={handleSubmit}
                  disabled={submitting}
                  className="px-8 py-2 bg-emerald-600 text-white rounded-lg font-bold hover:bg-emerald-700 disabled:opacity-50"
                >
                  {submitting ? "Submitting..." : "Submit Assessment"}
                </button>
              ) : (
                <button 
                  onClick={() => setCurrentIndex(currentIndex + 1)}
                  className="px-6 py-2 text-indigo-600 font-medium"
                >
                  Skip →
                </button>
              )}
            </div>
          </div>
        </div>
      );
    }

    function SummaryReport({ results, clientInfo }) {
      return (
        <div className="space-y-8">
          <header className="flex justify-between items-center">
            <div>
              <h2 className="text-3xl font-bold text-slate-900">Psychometric Summary</h2>
              <p className="text-slate-500">{clientInfo.name} • {clientInfo.dob}</p>
            </div>
            <button onClick={() => window.print()} className="px-4 py-2 bg-slate-900 text-white rounded-lg font-medium">Print PDF</button>
          </header>

          <div className="grid grid-cols-4 gap-4">
            {Object.entries(results.rawResults).map(([test, data]) => (
              <div key={test} className="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <p className="text-sm text-slate-500 font-medium">{test}</p>
                <p className="text-3xl font-bold text-indigo-600 mt-1">{data.total}</p>
              </div>
            ))}
          </div>

          <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <h3 className="font-bold text-lg mb-4">Identified Trait Clusters</h3>
            <div className="space-y-3">
              {results.thematicAnalysis.map((theme, i) => (
                <div key={i} className="p-4 bg-indigo-50 border-l-4 border-indigo-500 rounded-r-lg">
                  <div className="flex justify-between items-center mb-1">
                    <h4 className="font-bold text-indigo-900">{theme.themeName}</h4>
                    <span className="text-xs font-bold bg-indigo-200 text-indigo-800 px-2 py-1 rounded">{theme.prominence}</span>
                  </div>
                  <p className="text-sm text-slate-600">{theme.description}</p>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    function ClinicianPortal({ isAuthenticated, setIsAuthenticated, adminRecords, setAdminRecords, submitToBackend, showToast }) {
      const [pin, setPin] = useState("");

      const handleLogin = async (e) => {
        e.preventDefault();
        try {
          const res = await fetch(CONFIG.GAS_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: "getAdminData", accessPin: pin, apiKey: CONFIG.API_KEY }),
            redirect: 'follow'
          });
          const json = JSON.parse(await res.text());
          if (json.status === "error") throw new Error(json.message);
          
          setAdminRecords(json.data.records);
          setIsAuthenticated(true);
          showToast("Access Granted", "success");
        } catch (err) {
          showToast("Access Denied: " + err.message, "error");
        }
      };

      if (!isAuthenticated) {
        return (
          <div className="max-w-md mx-auto bg-white p-8 rounded-xl shadow-sm border border-slate-200 mt-12">
            <h2 className="text-2xl font-bold mb-6 text-center">Clinician Security Check</h2>
            <form onSubmit={handleLogin} className="space-y-4">
              <input 
                type="password" 
                placeholder="Enter Administrative PIN" 
                value={pin}
                onChange={e => setPin(e.target.value)}
                className="w-full border border-slate-300 rounded-lg p-3 text-center text-lg tracking-widest focus:ring-2 focus:ring-indigo-500 outline-none" 
              />
              <button type="submit" className="w-full bg-slate-900 text-white py-3 rounded-lg font-bold hover:bg-slate-800 transition">
                Verify & Unlock
              </button>
            </form>
          </div>
        );
      }

      return (
        <div className="space-y-6">
          <div className="flex justify-between items-center">
            <h2 className="text-3xl font-bold text-slate-900">Clinician Registry</h2>
            <button onClick={() => setIsAuthenticated(false)} className="text-red-600 font-medium">Lock & Exit</button>
          </div>
          
          <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <table className="w-full text-left">
              <thead className="bg-slate-50 border-b border-slate-200">
                <tr>
                  <th className="p-4 font-semibold text-slate-600">Date</th>
                  <th className="p-4 font-semibold text-slate-600">Client</th>
                  <th className="p-4 font-semibold text-slate-600">AQ</th>
                  <th className="p-4 font-semibold text-slate-600">RAADS</th>
                  <th className="p-4 font-semibold text-slate-600">CAT-Q</th>
                  <th className="p-4 font-semibold text-slate-600">CATI</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100">
                {adminRecords.map(r => (
                  <tr key={r.id} className="hover:bg-slate-50">
                    <td className="p-4 text-sm text-slate-500">{r.timestamp}</td>
                    <td className="p-4 font-medium">{r.name}</td>
                    <td className="p-4">{r.totals.AQ}</td>
                    <td className="p-4">{r.totals.RAADS}</td>
                    <td className="p-4">{r.totals.CATQ}</td>
                    <td className="p-4">{r.totals.CATI}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // ==========================================
    // HELPER FUNCTIONS
    // ==========================================
    function cleanTestData(raw) {
      const clean = {};
      Object.entries(raw).forEach(([k, v]) => {
        const cleanKey = k.trim().replace(/\s+/g, "");
        clean[cleanKey] = { ...v, questions: v.questions.map(q => ({...q, id: String(q.id).trim()})) };
      });
      return clean;
    }

    function flattenQuestions(data) {
      const flat = [];
      ['AQ', 'RAADS', 'CATQ', 'CATI'].forEach(testId => {
        if (data[testId]) {
          data[testId].questions.forEach(q => {
            flat.push({
              ...q,
              testId,
              options: q.options || Object.keys(q.weights).map(k => k.trim())
            });
          });
        }
      });
      return flat;
    }

    function formatLabel(key) {
      return key.replace(/([A-Z])/g, ' $1').replace(/^./, str => str.toUpperCase()).trim();
    }

    // Render App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
