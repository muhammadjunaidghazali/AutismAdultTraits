<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clinical Psychometric Workspace</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .fade-in { animation: fadeIn 0.3s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 h-screen overflow-hidden">
  <div id="root" class="h-full"></div>
  <script src="scoring.js"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const CONFIG = {
      GAS_URL: "https://script.google.com/macros/s/AKfycbwDORC7NB5MGwneZb9-PFm3ivOTep5Be8OM9YbRcquPq8KHfDNqcPUKmdMUJtFcSRws_Q/exec",
      API_KEY: "NEURO_SCREEN_SECRET_2026"
    };

    function App() {
      const [view, setView] = useState('overview');
      const [testData, setTestData] = useState(null);
      const [flatQuestions, setFlatQuestions] = useState([]);
      const [clientInfo, setClientInfo] = useState(null);
      const [answers, setAnswers] = useState({});
      const [qualitativeNotes, setQualitativeNotes] = useState({});
      const [results, setResults] = useState(null);
      const [adminRecords, setAdminRecords] = useState([]);
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [toast, setToast] = useState(null);

      useEffect(() => {
        fetch('tests.json').then(res => res.json()).then(raw => {
          const cleaned = cleanTestData(raw);
          setTestData(cleaned);
          setFlatQuestions(flattenQuestions(cleaned));
          
          // 🔄 AUTO-RESUME LOGIC
          const savedState = localStorage.getItem('neuro_assessment_state');
          if (savedState) {
            const parsed = JSON.parse(savedState);
            if (parsed.clientInfo && parsed.answers) {
              if (confirm("Resume your previous assessment progress?")) {
                setClientInfo(parsed.clientInfo);
                setAnswers(parsed.answers);
                setQualitativeNotes(parsed.qualitativeNotes || {});
                setView('assessment');
              } else {
                localStorage.removeItem('neuro_assessment_state');
              }
            }
          }
        }).catch(err => showToast("Failed to load tests.json: " + err.message, "error"));
      }, []);

      // 💾 AUTO-SAVE LOGIC
      useEffect(() => {
        if (clientInfo && Object.keys(answers).length > 0) {
          localStorage.setItem('neuro_assessment_state', JSON.stringify({
            clientInfo, answers, qualitativeNotes
          }));
        }
      }, [answers, qualitativeNotes, clientInfo]);

      const showToast = (msg, type = "info") => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 5000);
      };

      const submitToBackend = async (payload) => {
        try {
          const response = await fetch(CONFIG.GAS_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // CRITICAL for GAS CORS
            body: JSON.stringify({ ...payload, apiKey: CONFIG.API_KEY }),
            redirect: 'follow'
          });
          
          const text = await response.text();
          if (text.trim().startsWith("<!DOCTYPE html>") || text.includes("<html")) {
            throw new Error("GAS returned HTML. Check Deployment 'Anyone' access & New Version.");
          }
          
          const json = JSON.parse(text);
          if (json.status === "error") throw new Error(json.message);
          return json;
        } catch (err) {
          console.error("Backend Error:", err);
          throw err;
        }
      };

      return (
        <div className="flex h-full">
          <Sidebar view={view} setView={setView} />
          <main className="flex-1 overflow-y-auto p-8 bg-slate-50">
            <div className="max-w-6xl mx-auto fade-in">
              {view === 'overview' && <Overview setView={setView} flatQuestions={flatQuestions} hasSavedProgress={!!localStorage.getItem('neuro_assessment_state')} />}
              {view === 'intake' && <IntakeForm setView={setView} setClientInfo={setClientInfo} setAnswers={setAnswers} />}
              {view === 'assessment' && clientInfo && testData && (
                <AssessmentWizard 
                  testData={testData} 
                  questions={flatQuestions} 
                  clientInfo={clientInfo}
                  answers={answers}
                  setAnswers={setAnswers}
                  qualitativeNotes={qualitativeNotes}
                  setQualitativeNotes={setQualitativeNotes}
                  setResults={setResults}
                  setView={setView}
                  submitToBackend={submitToBackend}
                  showToast={showToast}
                />
              )}
              {view === 'summary' && results && <SummaryReport results={results} clientInfo={clientInfo} />}
              {view === 'clinician' && (
                <ClinicianPortal isAuthenticated={isAuthenticated} setIsAuthenticated={setIsAuthenticated} adminRecords={adminRecords} setAdminRecords={setAdminRecords} submitToBackend={submitToBackend} showToast={showToast} />
              )}
            </div>
          </main>
          {toast && (
            <div className={`fixed bottom-6 right-6 px-6 py-3 rounded-lg shadow-lg text-white font-medium z-50 ${toast.type === 'error' ? 'bg-red-600' : toast.type === 'success' ? 'bg-emerald-600' : 'bg-indigo-600'}`}>
              {toast.msg}
            </div>
          )}
        </div>
      );
    }

    function Sidebar({ view, setView }) {
      const links = [
        { id: 'overview', label: 'Overview', icon: '🏠' },
        { id: 'intake', label: 'Candidate Intake', icon: '📝' },
        { id: 'clinician', label: 'Clinician Portal', icon: '🔒' },
      ];
      return (
        <aside className="w-64 bg-slate-900 text-slate-300 flex flex-col p-6 shadow-xl">
          <div className="mb-10">
            <h1 className="text-xl font-bold text-white flex items-center gap-2"><span className="bg-indigo-500 p-2 rounded-lg text-sm">CP</span> Psychometric</h1>
            <p className="text-xs text-slate-500 mt-1">Clinical Workspace</p>
          </div>
          <nav className="flex-1 space-y-2">
            {links.map(link => (
              <button key={link.id} onClick={() => setView(link.id)} className={`w-full text-left px-4 py-3 rounded-lg font-medium transition flex items-center gap-3 ${view === link.id ? 'bg-indigo-600 text-white shadow-md' : 'hover:bg-slate-800'}`}>
                <span>{link.icon}</span> {link.label}
              </button>
            ))}
          </nav>
        </aside>
      );
    }

    function Overview({ setView, flatQuestions, hasSavedProgress }) {
      return (
        <div className="space-y-8">
          <header><h2 className="text-3xl font-bold text-slate-900">Neurodiversity Screening Workspace</h2></header>
          <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
              <h3 className="font-semibold text-slate-900 mb-2">Candidate Assessment</h3>
              <button onClick={() => setView('intake')} className="w-full bg-indigo-600 text-white py-2 rounded-lg font-medium hover:bg-indigo-700 transition mt-4">Start New Intake</button>
              {hasSavedProgress && (
                <button onClick={() => setView('assessment')} className="w-full bg-emerald-600 text-white py-2 rounded-lg font-medium hover:bg-emerald-700 transition mt-2">Resume Saved Assessment</button>
              )}
            </div>
            <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
              <h3 className="font-semibold text-slate-900 mb-2">Battery Status</h3>
              <div className="text-2xl font-bold text-emerald-600 mt-4">{flatQuestions.length} Items Ready</div>
            </div>
            <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
              <h3 className="font-semibold text-slate-900 mb-2">Data Security</h3>
              <div className="text-2xl font-bold text-indigo-600 mt-4">API Key Active</div>
            </div>
          </div>
        </div>
      );
    }

    function IntakeForm({ setView, setClientInfo, setAnswers }) {
      const [form, setForm] = useState({ name: '', email: '', phone: '', dob: '' });
      const [consent, setConsent] = useState(false);
      const handleSubmit = (e) => {
        e.preventDefault();
        if (!consent) return alert("Please provide consent.");
        setClientInfo(form); setAnswers({}); setView('assessment');
      };
      return (
        <div className="max-w-2xl mx-auto bg-white p-8 rounded-xl shadow-sm border border-slate-200">
          <h2 className="text-2xl font-bold mb-6">Candidate Intake</h2>
          <form onSubmit={handleSubmit} className="space-y-4">
            <div className="grid grid-cols-2 gap-4">
              <input required type="text" placeholder="Full Name" className="border p-2 rounded" onChange={e => setForm({...form, name: e.target.value})} />
              <input required type="email" placeholder="Email" className="border p-2 rounded" onChange={e => setForm({...form, email: e.target.value})} />
              <input type="text" placeholder="Phone" className="border p-2 rounded" onChange={e => setForm({...form, phone: e.target.value})} />
              <input required type="date" className="border p-2 rounded" onChange={e => setForm({...form, dob: e.target.value})} />
            </div>
            <label className="flex items-center gap-2 text-sm"><input type="checkbox" checked={consent} onChange={e => setConsent(e.target.checked)} /> I consent to data transmission for clinical screening.</label>
            <button type="submit" className="w-full bg-indigo-600 text-white py-3 rounded-lg font-bold">Begin Assessment Battery</button>
          </form>
        </div>
      );
    }

    function AssessmentWizard({ testData, questions, clientInfo, answers, setAnswers, qualitativeNotes, setQualitativeNotes, setResults, setView, submitToBackend, showToast }) {
      const [currentIndex, setCurrentIndex] = useState(0);
      const [submitting, setSubmitting] = useState(false);
      const currentQ = questions[currentIndex];
      const progress = ((currentIndex + 1) / questions.length) * 100;

      // 🧠 KEYBOARD NAVIGATION
      useEffect(() => {
        const handleKey = (e) => {
          if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
          const num = parseInt(e.key);
          if (num >= 1 && num <= currentQ.options.length) {
            handleSelect(currentQ.options[num - 1]);
          }
        };
        window.addEventListener('keydown', handleKey);
        return () => window.removeEventListener('keydown', handleKey);
      }, [currentIndex]);

      const handleSelect = (optionKey) => {
        const newAnswers = { ...answers, [`${currentQ.testId}_${currentQ.id}`]: optionKey };
        setAnswers(newAnswers);
        if (currentIndex < questions.length - 1) setTimeout(() => setCurrentIndex(currentIndex + 1), 150);
      };

      const handleSubmit = async () => {
        setSubmitting(true);
        try {
          // ✅ BUG FIX: testData is now correctly passed and used
          const engine = new AutismAssessmentEngine();
          const res = engine.calculateScores(answers, testData);
          
          const payload = {
            action: "submitAssessment", 
            client: clientInfo,
            totals: { AQ: res.rawResults.AQ.total, RAADS: res.rawResults.RAADS.total, CATQ: res.rawResults.CATQ.total, CATI: res.rawResults.CATI.total },
            metrics: res.normalizedMetrics, 
            themes: res.thematicAnalysis, 
            matrix: res.matrix,
            qualitativeNotes: qualitativeNotes, // 🧠 Send clinical context
            answers: answers
          };

          await submitToBackend(payload);
          localStorage.removeItem('neuro_assessment_state'); // Clear saved state
          setResults(res); 
          setView('summary'); 
          showToast("Assessment submitted successfully!", "success");
        } catch (err) { 
          showToast("Submission failed: " + err.message, "error"); 
          console.error(err);
        } finally { 
          setSubmitting(false); 
        }
      };

      if (!currentQ) return null;

      // 🧠 QUALITATIVE CONTEXT PROMPTS (Shown at the end)
      if (currentIndex === questions.length) {
        return (
          <div className="max-w-3xl mx-auto bg-white p-8 rounded-xl shadow-sm border border-slate-200">
            <h2 className="text-2xl font-bold mb-2">Clinical Context & Lived Experience</h2>
            <p className="text-slate-500 mb-6">These optional questions help your clinician understand the *context* behind your scores. They differentiate between burnout, trauma, and neurodivergent traits.</p>
            <div className="space-y-6">
              <div>
                <label className="block font-semibold mb-2">1. Describe a recent environment or situation that caused sensory or social overload.</label>
                <textarea className="w-full border p-3 rounded h-24" onChange={e => setQualitativeNotes({...qualitativeNotes, overload: e.target.value})} />
              </div>
              <div>
                <label className="block font-semibold mb-2">2. What specific routines, monotropic interests, or environments bring you a sense of regulation?</label>
                <textarea className="w-full border p-3 rounded h-24" onChange={e => setQualitativeNotes({...qualitativeNotes, regulation: e.target.value})} />
              </div>
              <div>
                <label className="block font-semibold mb-2">3. In what situations do you feel you are 'performing' or masking the most, and how does it affect your energy?</label>
                <textarea className="w-full border p-3 rounded h-24" onChange={e => setQualitativeNotes({...qualitativeNotes, masking: e.target.value})} />
              </div>
            </div>
            <div className="flex justify-between mt-8">
              <button onClick={() => setCurrentIndex(questions.length - 1)} className="px-6 py-2 text-slate-600 font-medium">← Back to Questions</button>
              <button onClick={handleSubmit} disabled={submitting} className="px-8 py-3 bg-emerald-600 text-white rounded-lg font-bold hover:bg-emerald-700 disabled:opacity-50">
                {submitting ? "Calculating & Securing..." : "Finalize & Submit"}
              </button>
            </div>
          </div>
        );
      }

      return (
        <div className="max-w-3xl mx-auto">
          <div className="mb-6">
            <div className="flex justify-between text-sm font-medium text-slate-500 mb-2"><span>{currentQ.testId} • Item {currentQ.id}</span><span>{currentIndex + 1} / {questions.length}</span></div>
            <div className="w-full bg-slate-200 rounded-full h-2.5"><div className="bg-indigo-600 h-2.5 rounded-full transition-all duration-300" style={{ width: `${progress}%` }}></div></div>
          </div>
          <div className="bg-white p-8 rounded-xl shadow-sm border border-slate-200 min-h-[400px] flex flex-col">
            <h2 className="text-2xl font-semibold text-slate-900 mb-8 flex-1">{currentQ.text}</h2>
            <div className="grid grid-cols-1 gap-3">
              {currentQ.options.map((opt, idx) => (
                <button key={opt} onClick={() => handleSelect(opt)} className={`text-left p-4 rounded-lg border-2 transition font-medium flex items-center gap-3 ${answers[`${currentQ.testId}_${currentQ.id}`] === opt ? 'border-indigo-600 bg-indigo-50 text-indigo-900' : 'border-slate-200 hover:border-indigo-300'}`}>
                  <span className="w-6 h-6 rounded bg-slate-100 text-xs flex items-center justify-center font-bold">{idx + 1}</span>
                  {formatLabel(opt)}
                </button>
              ))}
            </div>
            <div className="flex justify-between mt-8 pt-6 border-t border-slate-100">
              <button onClick={() => setCurrentIndex(Math.max(0, currentIndex - 1))} disabled={currentIndex === 0} className="px-6 py-2 text-slate-600 font-medium disabled:opacity-50">← Previous</button>
              <button onClick={() => setCurrentIndex(currentIndex + 1)} className="px-6 py-2 text-indigo-600 font-medium">Skip →</button>
            </div>
            <p className="text-center text-xs text-slate-400 mt-4">Tip: Press numbers 1-{currentQ.options.length} on your keyboard to select quickly.</p>
          </div>
        </div>
      );
    }

    // ... (Keep ProfilingMatrixView, SummaryReport, ClinicianPortal from previous response) ...
    // Note: Ensure SummaryReport includes <ProfilingMatrixView matrix={results.matrix} />
    
    // Helper functions (cleanTestData, flattenQuestions, formatLabel) remain the same.
    function cleanTestData(raw) {
      const clean = {};
      Object.entries(raw).forEach(([k, v]) => {
        const cleanKey = k.trim().replace(/\s+/g, "").toUpperCase();
        if(cleanKey === "CAT_Q") clean["CATQ"] = { ...v, questions: v.questions.map(q => ({...q, id: String(q.id).trim()})) };
        else clean[cleanKey] = { ...v, questions: v.questions.map(q => ({...q, id: String(q.id).trim()})) };
      });
      return clean;
    }
    function flattenQuestions(data) {
      const flat = [];
      ['AQ', 'RAADS', 'CATQ', 'CATI'].forEach(testId => {
        if (data[testId]) {
          data[testId].questions.forEach(q => {
            flat.push({ ...q, testId, options: q.options || Object.keys(q.weights).map(k => k.trim()) });
          });
        }
      });
      return flat;
    }
    function formatLabel(key) { return key.replace(/([A-Z])/g, ' $1').replace(/^./, str => str.toUpperCase()).trim(); }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
